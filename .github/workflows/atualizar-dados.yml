name: Atualizar dados do site

# Lê o canal do YouTube (lives agendadas, últimos vídeos, Shorts, playlists) e as mesas do MesaQuest,
# e grava videos.json, episodios.json, mesas.json e as capas. O GitHub Pages republica sozinho a cada commit.
on:
  schedule:
    # uma vez por dia, às 17h17 de Brasília (20h17 UTC)
    - cron: "17 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow (para converter as capas)
        run: pip install --quiet pillow nh3

      - name: YouTube (lives, vídeos, Shorts e episódios)
        run: python3 -I scripts/atualizar_videos.py . || echo "::warning::Não deu para ler o YouTube agora; os dados anteriores foram mantidos."

      - name: MesaQuest (vagas e datas)
        run: python3 -I scripts/atualizar_mesas.py . || echo "::warning::Não deu para ler o MesaQuest agora; os dados anteriores foram mantidos."

      - name: Blog (páginas dos posts, inclusive os agendados)
        run: python3 -I scripts/gerar_blog.py . || echo "::warning::Não deu para gerar o blog agora."

      - name: Salvar se algo mudou
        run: |
          git config user.name "papodado-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza dados do site"
            git pull --rebase
            git push
          fi
