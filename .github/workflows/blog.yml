name: Gerar páginas do blog

# Cria uma página por post publicado (blog/<endereço>/), a lista /blog/, o 404, o sitemap e o feed.
# Roda quando um post é publicado no /admin (o Supabase chama este workflow) ou na mão: Actions → Run workflow.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  blog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --quiet pillow nh3

      - name: Gerar as páginas do blog
        run: python3 -I scripts/gerar_blog.py .

      - name: Salvar se algo mudou
        run: |
          git config user.name "papodado-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza o blog"
            git pull --rebase
            git push
          fi
